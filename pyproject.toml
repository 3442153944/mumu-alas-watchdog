[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mumu-alas-watchdog"
version = "1.3.0"
description = "MuMu 模拟器 + Alas 自动重启看门狗（GUI/CLI，单文件 exe 分发）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0,<7"]

[project.scripts]
mumu-alas-watchdog = "mumu_alas_watchdog.cli:main"

[tool.setuptools]
packages = ["mumu_alas_watchdog"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
